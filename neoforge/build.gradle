plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

// Compile against a library and bundle it into the jar (jar-in-jar), also putting it on the dev run classpath.
def includeCompile(entry) {
    project.dependencies {
        implementation(entry)
        jarJar(entry)
    }
    neoForge.runs.configureEach {
        project.dependencies.add(additionalRuntimeClasspathConfiguration.name, entry)
    }
}

configurations {
    // Mods that should only be present in dev runs, never compiled against or published.
    localRuntime {
        canBeResolved = false
        canBeConsumed = false
    }
    runtimeClasspath.extendsFrom(localRuntime)
}

dependencies {
    // Mod dependencies, e.g.:
    //   compileOnly libs.some.mod.neoforge   // compile against it
    //   localRuntime libs.some.mod.neoforge  // only present in dev runs
    //   includeCompile libs.some.library     // bundle a plain java library

    implementation(libs.dimdoors.neoforge)
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    def interfaces = project(':common').file('src/main/resources/interfaces.json')
    if (interfaces.exists()) {
        interfaceInjectionData.from(interfaces.absolutePath)
    }

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
            logLevel = org.slf4j.event.Level.INFO
        }
        client {
            client()
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir project(':common').file('src/main/generated')
}
