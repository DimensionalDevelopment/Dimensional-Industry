[libraries]
#compile tooling
annotations = { group = "org.jetbrains", name = "annotations", version = "24.1.0" }
commons-lang3 = { group = "org.apache.commons", name = "commons-lang3", version = "3.14.0" }
mixin = { group = "org.spongepowered", name = "mixin", version = "0.8.5" }
asm-tree = { group = "org.ow2.asm", name = "asm-tree", version = "9.6" }
mixinextras-common = { group = "io.github.llamalad7", name = "mixinextras-common", version = "0.3.5" }

#fabric
minecraft = { group = "com.mojang", name = "minecraft", version = "1.21.1" }
parchment = { group = "org.parchmentmc.data", name = "parchment-1.21.1", version = "2024.11.17" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version = "0.116.6+1.21.1" }
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version = "0.18.4" }

# Mod dependencies go here. Modrinth and CurseMaven repositories are already wired up in
# buildSrc/src/main/groovy/multiloader-common.gradle, e.g.:
#   some-mod-fabric = { group = "maven.modrinth", name = "some-mod", version = "1.0.0+fabric" }
#   some-mod-neoforge = { group = "curse.maven", name = "some-mod-123456", version = "7654321" }
dimdoors-common = { group = "org.dimdev", name = "dimdoors-common-1.21.1", version = "6.3.0" }
dimdoors-fabric = { group = "org.dimdev", name = "dimdoors-fabric-1.21.1", version = "6.3.0" }
dimdoors-neoforge = { group = "org.dimdev", name = "dimdoors-neoforge-1.21.1", version = "6.3.0" }
apfloat = { group = "org.apfloat", name = "apfloat", version = "1.16.0" }
jheaps = { group = "org.jheaps", name = "jheaps", version = "0.14" }
jgrapht = { group = "org.jgrapht", name = "jgrapht-core", version = "1.6.0-SNAPSHOT" }
poly2tri = { group = "com.github.DimensionalDevelopment", name = "poly2tri.java", version = "0.1.1" }
fabric-asm = { group = "com.github.Chocohead", name = "Fabric-ASM", version = "v2.3" }

#sable (Simulated/Aeronautics pull it in; pinned to the version DimDoors compiles against)
sable-common = { group = "dev.ryanhcode.sable", name = "sable-common-1.21.1", version = "2.0.5" }
sable-fabric = { group = "dev.ryanhcode.sable", name = "sable-fabric-1.21.1", version = "2.0.5" }
sable-neoforge = { group = "dev.ryanhcode.sable", name = "sable-neoforge-1.21.1", version = "2.0.5" }

#create
create = { group = "curse.maven", name = "create-328085", version = "7963363" }
# Create's CurseMaven jar has no POM, so its jar-in-jar'd deps never reach the compile classpath.
# Versions match what that jar bundles (META-INF/jarjar/metadata.json).
ponder-neoforge = { group = "net.createmod.ponder", name = "ponder-neoforge", version = "1.0.82+mc1.21.1" }
flywheel-neoforge = { group = "dev.engine-room.flywheel", name = "flywheel-neoforge-1.21.1", version = "1.0.6" }

#simulated
simulated-common = { group = "dev.simulated_team.simulated", name = "simulated-common-1.21.1", version = "1.3.1" }
simulated-neoforge = { group = "dev.simulated_team.simulated", name = "simulated-neoforge-1.21.1", version = "1.3.1" }

#aeronautics
aeronautics-common = { group = "dev.eriksonn.aeronautics", name = "aeronautics-common-1.21.1", version = "1.3.1" }
aeronautics-neoforge = { group = "dev.eriksonn.aeronautics", name = "aeronautics-neoforge-1.21.1", version = "1.3.1" }
